[global]
    server string = somascan test server
    security = user
    server min protocol = SMB2
    map to guest = Never
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    unix charset = UTF-8
    log level = 1

[Warehouse]
    path = /storage
    browseable = yes
    writable = yes
    read only = no
    valid users = scanner
    force user = root
    force group = root
    create mask = 0664
    directory mask = 0775
