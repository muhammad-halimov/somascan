apply plugin: 'com.android.application'

/*
 * Ключ подписи приложения — общий для всех машин (android/keystore/somascan.jks, параметры —
 * в android/keystore.properties; оба файла не в git, копию хранить отдельно). Им подписываются и debug,
 * и release: SHA-1 один, и одного OAuth-клиента Google (вход в Google Drive) хватает для любой сборки.
 * Без keystore.properties debug подписывается обычным debug-ключом машины (~/.android/debug.keystore).
 */
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "com.somascan.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.somascan.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingPropertiesFile.exists()) {
            somascan {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (signingPropertiesFile.exists()) signingConfig signingConfigs.somascan
        }
        release {
            if (signingPropertiesFile.exists()) signingConfig signingConfigs.somascan
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Панель действий Material 3 в теме приложения (NativeSheetPlugin).
    implementation "com.google.android.material:material:$androidxMaterialVersion"
    // Сетевой диск Windows (SMB 2/3) для выгрузки таблицы (SmbSharePlugin).
    implementation "com.hierynomus:smbj:$smbjVersion"
    // Вход через Google и токены Drive (GoogleDriveAuthPlugin).
    implementation "com.google.android.gms:play-services-auth:$playServicesAuthVersion"
    // Фоновая выгрузка: работа, которая переживает закрытие приложения (UploadWork), и ресурсы движка в WebView (UploadEngine).
    implementation "androidx.work:work-runtime:$workRuntimeVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
